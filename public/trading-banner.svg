  <text x="400" y="440" font-family="Arial, sans-serif" font-size="14" fill="#9aa0aa" text-anchor="middle">K线图表</text>
  
  <circle cx="600" cy="400" r="25" fill="#1a1b1f" stroke="#00ffa3" stroke-width="2"/>
